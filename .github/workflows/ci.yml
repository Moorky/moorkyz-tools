name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repository
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm test:directory-cleaner:browser
      - run: pnpm check:source
      - run: pnpm audit --audit-level=low
      - run: pnpm licenses list --json

  videocrunch-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify Windows VideoCrunch API contract
        run: node --test tools/videocrunch/test/server.test.js

  visory-report-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: dotnet build ../tools/visory-media-downloader/src/tests/MoorkszVisoryMediaDownloader.Tests -c Debug
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - name: Verify native report browser contract
        env:
          TOOLS_NATIVE_REPORT_TESTS: '1'
        run: pnpm exec playwright test --config playwright/playwright.config.mjs --project=chromium visory-report.spec.js

  container:
    runs-on: ubuntu-latest
    needs: [verify, videocrunch-windows, visory-report-windows]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --pull --tag moorkyz-tools:${{ github.sha }} .
      - name: Smoke-test production container
        shell: bash
        env:
          IMAGE_TAG: moorkyz-tools:${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker rm --force ci-app >/dev/null 2>&1 || true' EXIT
          docker run --detach --name ci-app --publish 127.0.0.1::3000 "$IMAGE_TAG"
          published_port="$(docker port ci-app 3000/tcp | sed 's/.*://')"
          test -n "$published_port"
          for attempt in {1..45}; do
            if curl --fail --silent --max-time 3 "http://127.0.0.1:$published_port/" >/dev/null \
              && curl --fail --silent --max-time 3 "http://127.0.0.1:$published_port/" >/dev/null; then
              echo "Production health and root page passed."
              exit 0
            fi
            sleep 2
          done
          docker logs ci-app
          exit 1

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [verify, videocrunch-windows, visory-report-windows, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.COOLIFY_DEPLOY_ENABLED == 'true'
    environment: production
    timeout-minutes: 25
    concurrency:
      group: moorkyz-tools-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Skip stale production commits
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(process.env.GITHUB_API_URL + '/repos/' + process.env.GITHUB_REPOSITORY + '/git/ref/heads/master', {
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error('Cannot verify production branch head: HTTP ' + response.status);
          const ref = await response.json();
          const current = ref.object?.sha === process.env.GITHUB_SHA;
          appendFileSync(process.env.GITHUB_OUTPUT, 'current=' + current + '\n');
          if (!current) console.log('A newer production commit exists; skipping this deployment.');
          NODE
      - name: Deploy, wait for completion and check public health
        if: steps.head.outputs.current == 'true'
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL || 'https://tools.moorkyz.com/' }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: node src/scripts/deployment/deploy-coolify.cjs
